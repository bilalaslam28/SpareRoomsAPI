name: Scrape SpareRoom Listings

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8am UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/tender-sagan-rxza9j

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml pandas

      - name: Run scraper
        run: python main.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: spareroom-listings-${{ github.run_number }}
          path: spareroom_listing.csv
          retention-days: 30
